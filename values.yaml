# Default values for speech-ui.

image:
  repository: liavna/speech-ui
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8501

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Liveness and Readiness Probes
probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 10
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 10

# Ezua specific configuration for Istio VirtualService
ezua:
  enabled: true
  gateway: "istio-system/ezaf-gateway"
  prefix: "/speech-ui"
  host: "*"

# Optional configuration for the Whisper service URL
env:
  WHISPER_BASE_URL: "http://whisper-service:8000/v1"
  WHISPER_API_KEY: "dummy-key"
  WHISPER_MODEL: "whisper-1"
