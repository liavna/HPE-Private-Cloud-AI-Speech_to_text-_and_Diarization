{{- if .Values.ezua.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "speech-diarization.fullname" . }}
  labels:
    {{- include "speech-diarization.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.ezua.virtualService.endpoint | quote }}
  gateways:
    - {{ .Values.ezua.virtualService.istioGateway }}
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ include "speech-diarization.fullname" . }}
            port:
              number: {{ .Values.service.port }}
      timeout: 300s
{{- end }}
